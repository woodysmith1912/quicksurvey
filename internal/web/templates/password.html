{{define "content"}}
<h1>Change password</h1>
{{if .User.MustChangePassword}}
<p class="flash flash-error">This account still uses the password generated at first start. Choose a new one before continuing.</p>
{{end}}
<form method="post" action="/account/password" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="current">Current password</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <label for="new">New password</label>
  <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
  <p class="hint">At least 8 characters.</p>
  <label for="confirm">Repeat new password</label>
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
  <p><button class="primary" type="submit" data-testid="save-password">Change password</button></p>
</form>
{{end}}
