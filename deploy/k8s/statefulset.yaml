# A StatefulSet rather than a Deployment, for one specific reason.
#
# The volume is ReadWriteOnce, so it attaches to one node at a time. A
# Deployment's RollingUpdate starts the replacement pod before terminating the
# old one; if the scheduler puts it on another node, the new pod hangs forever
# on a Multi-Attach error. A StatefulSet's RollingUpdate terminates the old pod
# first and waits for it, which is exactly the ordering a single-writer store
# needs. Getting this wrong produces an outage on the first rollout that happens
# to cross nodes, which is to say: not the first rollout, and not reproducibly.
#
# One replica, permanently. SQLite would keep a second writer correct rather
# than corrupt, but nothing above the storage layer wants one.
#
# No PodDisruptionBudget: with a single replica, minAvailable: 1 would block
# node drains indefinitely and turn every cluster upgrade into a manual step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quicksurvey
  namespace: quicksurvey
  labels:
    app.kubernetes.io/name: quicksurvey
spec:
  serviceName: quicksurvey
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: quicksurvey
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quicksurvey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The CSI driver hands over a root-owned ext4 filesystem. fsGroup is
        # what makes /data writable by uid 65532; without it the process cannot
        # create its database and crash-loops.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Nothing in the pod talks to the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: quicksurvey
          # Push the image somewhere the cluster can pull from and set the tag
          # to a digest or an immutable version. :latest gives you no way to
          # know what is running or to roll back.
          image: ghcr.io/woodysmith1912/quicksurvey:v0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QS_DATA_DIR
              value: /data
            - name: QS_ADDR
              value: ":8080"
            # Used for the shareable link shown to editors. Without it the link
            # is rebuilt from proxy headers, which is usually right and
            # occasionally embarrassing.
            #
            # Written out literally, and kept in step with the Ingress host by a
            # CI check rather than by a kustomize replacement. A replacement
            # would fail broken: if a future kubectl changed its semantics the
            # placeholder would survive into production and editors would get
            # links to a host that does not exist. A literal is already correct
            # when the tooling misbehaves, and the check catches the error that
            # actually happens — editing the host here and not there.
            - name: QS_BASE_URL
              value: https://quicksurveys.plainwrapworks.com
            - name: QS_TZ
              value: America/New_York
            # Traefik terminates TLS, so cookies must be marked Secure.
            - name: QS_SECURE_COOKIES
              value: "true"
            # This cluster's Traefik serves :80 without redirecting to :443.
            # Secure cookies are not sent over http://, so a visitor arriving
            # there could not sign in or vote and would get no explanation.
            - name: QS_REDIRECT_HTTPS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The binary answers its own health check; the image has no shell or
          # HTTP client to probe with, and httpGet needs neither.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              # No CPU limit on purpose: throttling a request-serving process
              # buys nothing here, and the requests already protect the node.
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Retain, so deleting the StatefulSet or the PVC leaves the volume and
        # every response on it. do-block-storage-retain already exists in this
        # cluster; the default class deletes.
        storageClassName: do-block-storage-retain
        resources:
          requests:
            # DigitalOcean's minimum. The database is kilobytes.
            storage: 1Gi
